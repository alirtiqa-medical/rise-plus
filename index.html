<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>استبيان الصحة | Health Questionnaire</title>
<!-- نربط الاستبيان بنفس ملف الستايل الخاص بك ليأخذ نفس الألوان والهوية -->
<link href="style.css" rel="stylesheet"/>
<style>
  /* تنسيقات إضافية بسيطة للاستبيان لتناسب تصميمك الطبي */
  body { min-height: 100vh; display: flex; flex-direction: column; background-color: var(--bg); }
  .quiz-header { text-align: center; padding: 40px 20px 20px; }
  .quiz-badge { display: inline-block; background: linear-gradient(90deg,#176B5B,#00866A); color: #fff; padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 800; margin-bottom: 12px; box-shadow: 0 8px 18px rgba(0,134,106,.18); }
  .quiz-clinic-name { font-size: 26px; font-weight: 900; color: var(--heading); margin: 0; }
  
  .quiz-container { max-width: 520px; margin: 0 auto; padding: 30px 24px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadowSoft); border: 1px solid rgba(23,107,91,.10); text-align: center; width: 92%; }
  .quiz-step { display: none; animation: fadeIn 0.4s ease; }
  .quiz-step.active { display: block; }
  .quiz-title { font-size: 20px; font-weight: 900; color: var(--heading); margin-bottom: 24px; line-height: 1.5; }
  
  .quiz-btn { display: block; width: 100%; padding: 16px; margin-bottom: 14px; border-radius: 14px; border: 1px solid rgba(23,107,91,.16); background: var(--surface-2); color: var(--text); font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(17,77,64,.03); -webkit-appearance: none; font-family: inherit; }
  .quiz-btn:hover, .quiz-btn:active { background: linear-gradient(180deg,#176B5B,#00866A); color: #fff; border-color: transparent; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,134,106,.18); }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="is-loading">

<header class="quiz-header">
  <div class="quiz-badge" id="headerBadge">✔️ استبيان طبي معتمد</div>
  <h1 class="quiz-clinic-name" id="headerTitle">مركز الارتقاء الطبي</h1>
</header>

<main class="quiz-container">
  
  <!-- السؤال الأول: العمر -->
  <div class="quiz-step active" id="step1">
    <h2 class="quiz-title" id="q1_title">ما هي فئتك العمرية؟</h2>
    <button class="quiz-btn" onclick="nextStep(1)" id="q1_a1">20 - 30 سنة</button>
    <button class="quiz-btn" onclick="nextStep(1)" id="q1_a2">31 - 40 سنة</button>
    <button class="quiz-btn" onclick="nextStep(1)" id="q1_a3">41 - 50 سنة</button>
    <button class="quiz-btn" onclick="nextStep(1)" id="q1_a4">51 سنة وما فوق</button>
  </div>

  <!-- السؤال الثاني: الأمراض المزمنة -->
  <div class="quiz-step" id="step2">
    <h2 class="quiz-title" id="q2_title">هل تعاني من أي أمراض مزمنة؟ (ضغط، سكري، أمراض قلب)</h2>
    <button class="quiz-btn" onclick="finishQuiz()" id="q2_a1">لا، الحمد لله بصحة جيدة</button>
    <button class="quiz-btn" onclick="finishQuiz()" id="q2_a2">نعم، ضغط أو سكري</button>
    <button class="quiz-btn" onclick="finishQuiz()" id="q2_a3">نعم، أمراض أخرى</button>
  </div>

</main>

<!-- شريط التحميل (نفس التصميم الموجود في ستايل موقعك) -->
<div class="site-loader" id="quizLoader" style="opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .48s ease, visibility .48s ease;">
  <div class="site-loader__inner">
    <div class="site-loader__mark">
      <div class="site-loader__cross"></div>
    </div>
    <h2 class="site-loader__title" id="loaderTitle">جارٍ تحليل الإجابات...</h2>
    <div class="site-loader__subtitle" id="loaderSub">نبحث عن الحل الطبي الأنسب لحالتك</div>
    <div class="site-loader__bar"><span></span></div>
  </div>
</div>

<script>
  // نزيل كلاس التحميل عند فتح الصفحة لنظهر الاستبيان
  document.body.classList.remove('is-loading');

  const quizDict = {
    headerBadge: { ar: "✔️ استبيان طبي معتمد", en: "✔️ Certified Medical Quiz", he: "✔️ שאלון רפואי מוסמך" },
    headerTitle: { ar: "مركز الارتقاء الطبي", en: "Medical Elevation Center", he: "מרכז העלייה הרפואי" },
    
    q1_title: { ar: "ما هي فئتك العمرية؟", en: "What is your age group?", he: "מהי קבוצת הגיל שלך?" },
    q1_a1: { ar: "20 - 30 سنة", en: "20 - 30 years", he: "20 - 30 שנים" },
    q1_a2: { ar: "31 - 40 سنة", en: "31 - 40 years", he: "31 - 40 שנים" },
    q1_a3: { ar: "41 - 50 سنة", en: "41 - 50 years", he: "41 - 50 שנים" },
    q1_a4: { ar: "51 سنة وما فوق", en: "51 years and above", he: "51 שנים ומעלה" },
    
    q2_title: { ar: "هل تعاني من أي أمراض مزمنة؟ (ضغط، سكري)", en: "Do you suffer from any chronic diseases?", he: "האם אתה סובל ממחלות כרוניות כלשהן?" },
    q2_a1: { ar: "لا، الحمد لله بصحة جيدة", en: "No, I am completely healthy", he: "לא, אני בריא לחלוטין" },
    q2_a2: { ar: "نعم، ضغط أو سكري", en: "Yes, Blood Pressure or Diabetes", he: "כן, לחץ דם או סוכרת" },
    q2_a3: { ar: "أمراض أخرى", en: "Other conditions", he: "מחלות אחרות" },
    
    loaderTitle: { ar: "جارٍ تحليل البيانات...", en: "Analyzing data...", he: "מנתח נתונים..." },
    loaderSub: { ar: "نبحث عن الحل الطبي الأنسب والأكثر أماناً لحالتك", en: "Finding the safest medical solution", he: "מחפש את הפתרון הרפואי הבטוח ביותר עבורך" }
  };

  function applyLanguage() {
    const navLang = navigator.language || navigator.userLanguage || "en";
    let lang = "en";
    if (navLang.toLowerCase().startsWith("ar")) lang = "ar";
    if (navLang.toLowerCase().startsWith("he")) lang = "he";
    
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === "ar" || lang === "he") ? "rtl" : "ltr";
    
    Object.keys(quizDict).forEach(key => {
      const el = document.getElementById(key);
      if (el) el.textContent = quizDict[key][lang];
    });
  }

  applyLanguage();

  function nextStep(currentStep) {
    document.getElementById('step' + currentStep).classList.remove('active');
    document.getElementById('step' + (currentStep + 1)).classList.add('active');
  }

  function finishQuiz() {
    document.getElementById('step2').classList.remove('active');
    document.querySelector('.quiz-container').style.display = 'none';
    
    const loader = document.getElementById('quizLoader');
    document.body.classList.add('is-loading');
    loader.style.opacity = '1';
    loader.style.visibility = 'visible';
    loader.style.pointerEvents = 'auto';
    
    // الانتظار 3 ثوانٍ ثم التحويل إلى صفحة offer.html
    setTimeout(() => {
      window.location.replace('offer.html');
    }, 3000);
  }
</script>
</body>
</html>
